name: Collect news
on:
  schedule:
    - cron: "7 * * * *"      # every hour (GitHub may delay a few minutes)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python collector/collector.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit updated articles
        run: |
          git config user.name "khoborpath-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/articles.json data/health.json
          git diff --staged --quiet || (git commit -m "Update articles [skip ci]" && git pull --rebase && git push)
